name: foxllm
description: Client LLM Android hybride local et BYOK.
publish_to: none
version: 0.1.5+6

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  file_picker: ^12.3.0
  path_provider: ^2.1.6
  http: ^1.6.0
  # Horloge injectable : `clock.now()` donne l'heure réelle en production
  # et l'heure simulée sous test, là où `Stopwatch` ignore la seconde.
  clock: ^1.1.3
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  speech_to_text: ^7.3.0
  share_plus: ^13.3.0
  flutter_tts: ^4.2.3
  foxllm_native:
    path: packages/foxllm_native
  android_libcpp_shared: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    # Le fichier de licence de la racine est embarqué tel quel et affiché dans
    # « À propos » : une copie dans le code finirait par diverger de celui qui
    # fait foi.
    - LICENSE
