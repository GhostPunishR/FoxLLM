name: Flutter Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests yet; skipping.'
          fi
