name: FFI Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffi-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Dart ↔ C++ FFI Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/foxllm_native
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve native package dependencies
        run: dart pub get
      - name: Run FFI smoke test
        run: dart run test/native_smoke.dart
