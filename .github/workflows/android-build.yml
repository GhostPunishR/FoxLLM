name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify llama.cpp native engine is packaged
        shell: bash
        run: |
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/apk-files.txt
          grep -F 'lib/arm64-v8a/libfoxgpt_native.so' /tmp/apk-files.txt
          unzip -p build/app/outputs/flutter-apk/app-debug.apk \
            lib/arm64-v8a/libfoxgpt_native.so > /tmp/libfoxgpt_native.so
          strings /tmp/libfoxgpt_native.so | grep -F 'foxgpt-native/0.2.0+llama-b10903'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foxgpt-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
