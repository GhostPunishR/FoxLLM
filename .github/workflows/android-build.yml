name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify native FFI library is packaged
        shell: bash
        run: |
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/apk-files.txt
          grep -E 'lib/[^/]+/libfoxgpt_native\.so$' /tmp/apk-files.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foxgpt-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
