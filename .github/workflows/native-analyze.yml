name: Native Dart Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Native Dart Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/foxllm_native
    steps:
      - uses: actions/checkout@v4
        with:
          path: .
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: dart pub get
      - name: Analyze package
        run: dart analyze
