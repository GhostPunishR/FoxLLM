name: Dart Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Dart Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Check formatting
        run: >-
          dart format
          --output=none
          --set-exit-if-changed
          lib
          packages/foxgpt_native/lib
          packages/foxgpt_native/hook
          packages/foxgpt_native/tool
